<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ead8">
<title>計算機 · Bauhaus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ead8;
    --ink: #161616;
    --red: #d8321f;
    --blue: #1d4e9e;
    --yellow: #f2b90f;
    --line: 4px;
    --gap: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Jost", "Futura", "Century Gothic", "Avenir Next", "Noto Sans TC", sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow: hidden;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景幾何構成 */
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg i { position: absolute; display: block; }
  .bg .circle {
    width: 46vmin; height: 46vmin; border-radius: 50%;
    background: var(--red); left: -12vmin; top: -12vmin;
  }
  .bg .square {
    width: 34vmin; height: 34vmin;
    background: var(--blue); right: -8vmin; bottom: -8vmin;
  }
  .bg .triangle {
    width: 0; height: 0;
    border-left: 16vmin solid transparent;
    border-right: 16vmin solid transparent;
    border-bottom: 28vmin solid var(--yellow);
    right: 8vmin; top: 6vmin; transform: rotate(18deg);
  }
  .bg .bar {
    width: 60vmin; height: var(--line);
    background: var(--ink); left: 4vmin; bottom: 14vmin;
    transform: rotate(-32deg); transform-origin: left center;
  }

  .calc {
    position: relative; z-index: 1;
    width: min(380px, 100%);
    background: var(--paper);
    border: var(--line) solid var(--ink);
    box-shadow: 14px 14px 0 var(--ink);
    padding: 20px;
  }

  .brand {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px;
  }
  .brand span { display: block; width: 16px; height: 16px; }
  .brand .c { background: var(--red); border-radius: 50%; }
  .brand .s { background: var(--blue); }
  .brand .t {
    width: 0; height: 0; background: none;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 16px solid var(--yellow);
  }
  .brand b {
    margin-left: auto;
    font-weight: 700; font-size: 13px;
    letter-spacing: .32em; text-transform: lowercase;
  }

  .screen {
    background: var(--ink);
    color: var(--paper);
    padding: 14px 16px 12px;
    margin-bottom: 16px;
    text-align: right;
    border-bottom: 10px solid var(--yellow);
  }
  .expr {
    height: 22px; font-size: 16px; font-weight: 400;
    letter-spacing: .06em; opacity: .65;
    white-space: nowrap; overflow: hidden;
  }
  .value {
    height: 64px; line-height: 64px;
    font-size: 54px; font-weight: 500;
    white-space: nowrap; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
  }

  button {
    font: inherit; font-size: 26px; font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: var(--line) solid var(--ink);
    aspect-ratio: 1;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    transition: transform .06s ease, box-shadow .06s ease;
    box-shadow: 4px 4px 0 var(--ink);
  }
  button:active, button.pressed {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
  }
  button:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

  .fn { background: var(--yellow); }
  .op { background: var(--blue); color: var(--paper); border-radius: 50%; font-size: 30px; }
  .op.active { background: var(--paper); color: var(--blue); }
  .eq { background: var(--red); color: var(--paper); border-radius: 50%; font-size: 30px; }
  .zero { grid-column: span 2; aspect-ratio: auto; }

  @media (max-height: 640px) {
    .value { height: 48px; line-height: 48px; }
    button { aspect-ratio: 1.25; }
    .zero { aspect-ratio: auto; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="circle"></i><i class="triangle"></i><i class="square"></i><i class="bar"></i>
  </div>

  <main class="calc" aria-label="計算機">
    <div class="brand" aria-hidden="true">
      <span class="c"></span><span class="s"></span><span class="t"></span>
      <b>rechner</b>
    </div>

    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="value" id="value" role="status" aria-live="polite">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="fn" data-act="clear" aria-label="清除">AC</button>
      <button class="fn" data-act="sign" aria-label="正負號">±</button>
      <button class="fn" data-act="percent" aria-label="百分比">%</button>
      <button class="op" data-op="/" aria-label="除">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*" aria-label="乘">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-" aria-label="減">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+" aria-label="加">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-act="dot" aria-label="小數點">.</button>
      <button class="eq" data-act="equals" aria-label="等於">=</button>
    </div>
  </main>

<script>
(() => {
  const MAX_DIGITS = 12;
  const SYMBOL = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const valueEl = document.getElementById('value');
  const exprEl = document.getElementById('expr');
  const keysEl = document.getElementById('keys');

  let cur = '0';      // 目前輸入中的數字（字串）
  let prev = null;    // 前一個運算元
  let op = null;      // 等待中的運算子
  let fresh = true;   // 下一個數字鍵是否開始新輸入
  let error = false;
  let exprText = '';

  const compute = (a, b, o) => {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
  };

  // 消除浮點誤差（例如 0.1 + 0.2）
  const tidy = n => Number.isFinite(n) ? parseFloat(n.toPrecision(MAX_DIGITS)) : n;

  const toStr = n => {
    const abs = Math.abs(n);
    if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
      return n.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
    }
    return String(n);
  };

  const pretty = s => {
    if (s.includes('e')) return s;
    const neg = s.startsWith('-');
    const [int, dec] = s.replace('-', '').split('.');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + grouped + (dec !== undefined ? '.' + dec : '');
  };

  const render = () => {
    const text = error ? '錯誤' : pretty(cur);
    valueEl.textContent = text;
    exprEl.textContent = exprText;
    // 數字太長時自動縮小字級
    valueEl.style.fontSize = '';
    const base = parseFloat(getComputedStyle(valueEl).fontSize);
    const ratio = valueEl.clientWidth / valueEl.scrollWidth;
    if (ratio < 1) valueEl.style.fontSize = Math.floor(base * ratio) + 'px';
    keysEl.querySelectorAll('.op').forEach(b =>
      b.classList.toggle('active', !error && fresh && op === b.dataset.op));
  };

  const reset = () => { cur = '0'; prev = null; op = null; fresh = true; error = false; exprText = ''; };

  const fail = () => { reset(); error = true; };

  const inputNum = d => {
    if (error) reset();
    if (fresh) {
      if (op === null) { prev = null; exprText = ''; }
      cur = d; fresh = false; return;
    }
    if (cur.replace(/[-.]/g, '').length >= MAX_DIGITS) return;
    cur = cur === '0' ? d : cur === '-0' ? '-' + d : cur + d;
  };

  const inputDot = () => {
    if (error) reset();
    if (fresh) {
      if (op === null) { prev = null; exprText = ''; }
      cur = '0.'; fresh = false; return;
    }
    if (!cur.includes('.')) cur += '.';
  };

  const inputOp = o => {
    if (error) return;
    if (op !== null && !fresh) {
      const r = tidy(compute(prev, parseFloat(cur), op));
      if (!Number.isFinite(r)) return fail();
      prev = r; cur = toStr(r);
    } else {
      prev = parseFloat(cur);
    }
    op = o; fresh = true;
    exprText = pretty(toStr(prev)) + ' ' + SYMBOL[o];
  };

  const equals = () => {
    if (error) return;
    if (op === null) { cur = toStr(parseFloat(cur)); fresh = true; return; }
    const b = parseFloat(cur);
    const r = tidy(compute(prev, b, op));
    exprText = `${pretty(toStr(prev))} ${SYMBOL[op]} ${pretty(toStr(b))} =`;
    if (!Number.isFinite(r)) { fail(); return; }
    cur = toStr(r); prev = null; op = null; fresh = true;
  };

  const sign = () => {
    if (error) return;
    cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
    if (parseFloat(cur) === 0 && fresh) cur = '0';
  };

  const percent = () => {
    if (error) return;
    cur = toStr(tidy(parseFloat(cur) / 100));
    fresh = op === null;
    if (fresh) exprText = '';
  };

  const backspace = () => {
    if (error) { reset(); return; }
    if (fresh) return;
    cur = cur.slice(0, -1);
    if (cur === '' || cur === '-') cur = '0';
  };

  const actions = { clear: reset, sign, percent, dot: inputDot, equals };

  keysEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNum(b.dataset.num);
    else if (b.dataset.op) inputOp(b.dataset.op);
    else actions[b.dataset.act]();
    render();
  });

  const flash = selector => {
    const b = keysEl.querySelector(selector);
    if (!b) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 90);
  };

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (/^\d$/.test(k)) { inputNum(k); flash(`[data-num="${k}"]`); }
    else if (k === '.' || k === ',') { inputDot(); flash('[data-act="dot"]'); }
    else if ('+-*/'.includes(k)) { inputOp(k); flash(`[data-op="${k}"]`); }
    else if (k === 'x' || k === 'X') { inputOp('*'); flash('[data-op="*"]'); }
    else if (k === 'Enter' || k === '=') { equals(); flash('[data-act="equals"]'); }
    else if (k === '%') { percent(); flash('[data-act="percent"]'); }
    else if (k === 'Escape' || k === 'Delete' || k === 'c' || k === 'C') { reset(); flash('[data-act="clear"]'); }
    else if (k === 'Backspace') backspace();
    else return;
    e.preventDefault();
    render();
  });

  window.addEventListener('resize', render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  render();
})();
</script>
</body>
</html>
